<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEA - Área de Trabalho</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f3fc;
    }

    /* HEADER */
    .header {
      background-color: #256fa7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 20px;
    }

    /* NAVBAR */
    .navbar {
      width: 100%;
      background-color: #1F6FA3;
      border-top: 3px solid white;
    }

    /* MENU */
    .menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .menu li {
      position: relative;
    }

    .menu li a {
      display: block;
      padding: 14px 25px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: background-color 0.3s;
      cursor: pointer;
    }

    .menu li a:hover,
    .menu li a.active {
      background-color: #006b9f;
    }

    /* SUBMENU */
    .submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      min-width: 250px;
      list-style: none;
      padding: 0;
      margin: 0;
      z-index: 999;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .submenu li {
      width: 100%;
    }

    .submenu li a {
      color: #333;
      padding: 12px 15px;
      background-color: white;
    }

    .submenu li a:hover {
      background-color: #f1f5f9;
      color: #006b9f;
    }

    /* MOSTRAR SUBMENU */
    .dropdown:hover .submenu {
      display: block;
    }

    /* CONTAINER */
    .form-container {
      width: 100%;
      min-height: calc(100vh - 260px);
      margin-top: 20px;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

  </style>
</head>

<body>

  <!-- LOGIN -->
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <!-- HEADER -->
  <div class="header">
    <img src="CEASLOGAN3.png" alt="CEA Logo" style="max-width: 150px;">
    <h1>MANAUS I - Controle De Chaves</h1>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">

    <ul class="menu">

      <!-- MENU CHAVES -->
      <li class="dropdown">

        <a href="index.html" class="active">
          Controle de Chaves
        </a>

        <ul class="submenu">

          <li>
            <a href="index.html">
              Planilha de Controle
            </a>
          </li>

          <!-- BOTÃO POPUP -->
          <li>
            <a id="abrirMovimentacao">
              Movimentações
            </a>
          </li>

          <li>
            <a href="HISTORICO.HTML">
              Histórico
            </a>
          </li>

        </ul>

      </li>

      <!-- MENU RELATÓRIO -->
      <li>
        <a href="relatorio.html">
          Verificação de Setor
        </a>
      </li>

      <!-- SAIR -->
      <li>
        <a href="#" onclick="logout()">
          Sair
        </a>
      </li>

    </ul>

  </div>

  <!-- CONTEÚDO -->
  <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQAyzkKIKsKMEu2U7KJLIeIasv1mm72S-Z5KR7MFb9RMrvqYc0_vnH8VH_rZlIGJ5ND6Oov21Q8OG4E/pubhtml?widget=true&amp;headers=false"></iframe>

  <!-- BOTÃO FILLOUT INVISÍVEL -->
  <div
    id="filloutPopup"
    data-fillout-id="cQJhGV78Czus"
    data-fillout-embed-type="popup"
    data-fillout-button-text="Abrir"
    data-fillout-dynamic-resize
    data-fillout-button-color="#2E44BF"
    data-fillout-inherit-parameters
    data-fillout-popup-size="medium"
    style="display:none;">
  </div>

  <!-- SCRIPT FILLOUT -->
  <script src="https://server.fillout.com/embed/v1/"></script>

  <!-- SCRIPT ABRIR POPUP -->
  <script>

    window.addEventListener("load", function () {

      const menuBotao = document.getElementById("abrirMovimentacao");

      menuBotao.addEventListener("click", function () {

        const botaoFillout = document.querySelector(
          '[data-fillout-button-text="Abrir"] button'
        );

        if (botaoFillout) {
          botaoFillout.click();
        }

      });

    });

  </script>

  <!-- LOGOUT -->
  <script>
    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
